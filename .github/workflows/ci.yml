name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: haa
      - name: Install deps
        run: |
          conda activate haa
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          conda activate haa
          { /bin/bash -lc 'echo probe_login_ok; exit 3'; echo "login_probe_exit=$?"; \
            /bin/bash -c  'echo probe_plain_ok; exit 3'; echo "plain_probe_exit=$?"; } > probe.txt 2>&1 || true
          set -o pipefail
          python -m pytest --tb=short -ra 2>&1 | tee pytest_output.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            echo "## Failed tests" >> $GITHUB_STEP_SUMMARY
            grep -E "^(FAILED|ERROR)" pytest_output.log | head -20 | while read -r line; do
              echo "::error::$line"
              echo "- \`$line\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "::error::TAIL $(tail -c 600 pytest_output.log | tr '\n' ' | ')"
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -40 pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            { date -u; python -V; nproc; echo "TZ=$TZ LANG=$LANG HOME=$HOME";
              env | grep -E '^(CI|GITHUB_ACTIONS|RUNNER_ARCH|RUNNER_OS)' | head -6;
              echo '--- pip freeze ---'; pip freeze;
              echo '--- data/ dirs ---'; find data -maxdepth 2 -type d 2>/dev/null | head -20;
            } > ci_env.txt 2>&1 || true
            exit $st
          fi
      - name: Publish failure log
        if: failure()
        run: |
          git config user.name "haa-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -q -B ci-logs
          git add -f pytest_output.log
          [ -f ci_env.txt ] && git add -f ci_env.txt
          [ -f probe.txt ] && git add -f probe.txt
          git commit -q -m "CI failure log $(date -u +%FT%TZ)" || true
          git push -f origin ci-logs
      - name: Memory bank lint
        run: |
          conda activate haa
          python -m haa.cli.main memory lint
