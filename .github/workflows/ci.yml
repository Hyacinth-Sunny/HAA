name: CI
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: haa
      - name: Install deps
        run: |
          conda activate haa
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          conda activate haa
          python -m pytest --tb=short -q
      - name: Memory bank lint
        run: |
          conda activate haa
          python -m haa.cli.main memory lint
