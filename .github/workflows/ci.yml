name: CI
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: haa
      - name: Install deps
        run: |
          conda activate haa
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          conda activate haa
          set -o pipefail
          python -m pytest --tb=short -ra 2>&1 | tee pytest_output.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            echo "## Failed tests" >> $GITHUB_STEP_SUMMARY
            grep -E "^(FAILED|ERROR)" pytest_output.log | head -20 | while read -r line; do
              echo "::error::$line"
              echo "- \`$line\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "::error::TAIL $(tail -c 600 pytest_output.log | tr '\n' ' | ')"
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -40 pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $st
          fi
      - name: Memory bank lint
        run: |
          conda activate haa
          python -m haa.cli.main memory lint
