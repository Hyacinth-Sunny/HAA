# HATM 全链路冒烟配置（v1.0.2）——配套 data/brief_hatm_v2.yaml
# 用法：HAA_CONFIG=config/hatm-v2.yaml + DEEPSEEK_API_KEY / TAVILY_API_KEY
#   HAA_CONFIG=config/hatm-v2.yaml haa project start <project_id>
# 教训（smoke4）：不设 HAA_CONFIG 会静默落到 default.yaml 的 $100 闸——
# 现在启动 banner 会醒目打印生效配置，错配一眼可见。
llm:
  model: "deepseek/deepseek-v4-pro"
  max_retries: 2
  api_base: ""
  api_key_env: "DEEPSEEK_API_KEY"
  sub_agent_model: "deepseek/deepseek-v4-flash"

  # 价目兜底（smoke10 检视①收尾；来源 api-docs.deepseek.com 2026-10-08 实取）：
  # deepseek-v4-pro 人民币/百万tokens——输入(缓存未命中) 空闲4.5/高峰9.0，
  # 输出 空闲13.5/高峰27.0；此处按【高峰价×汇率7.1 四舍五入】保守计费
  # （宁多扣不漏扣；缓存命中价远低，不做抵扣）。切 Flash 时改为下方注释值。
  pricing:
    input_per_m: 1.30
    output_per_m: 3.80
    input_per_m_offpeak: 0.65   # 空闲档（工作日 9-12/14-18 外，北京时间）
    output_per_m_offpeak: 1.90
  # deepseek-flash（V4.1-Flash）折美元备查——高峰 input 0.30 / output 1.15；空闲 0.15 / 0.60

timeouts:
  llm: 300          # 空闲闸：相邻 chunk 间隔上限（流式化后语义）
  llm_wall: 1800    # 墙钟闸：单调用总上限
  stage: 3600       # 阶段墙钟：到点按工具帽同款收尾

budget:
  per_campaign: 10.0
  global_limit: 5.0
  # smoke10 检视项①：cost 记账半盲（deepseek 流式不回 usage、无单价表）→
  # token 双层帽兜底（OpenClaw 建议 30M/120M）。单价表挂账：待用户提供
  # deepseek-v4-pro 官方价目后加 llm.pricing（input_per_m/output_per_m）。
  per_campaign_tokens: 30000000
  global_tokens: 120000000

pipeline:
  max_design_rounds: 3
  max_review_rounds: 3
  # 全链路候选单个更重：少而精，候选间是竞争性全链路方案的对打
  # smoke9（8-27）：seek=3 全保留不滤除（用户要求 3 idea 全部进入后续阶段）
  seek_candidate_count: 3
  output_candidate_count: 3
  stage_tool_limits:
    # 2026-08-27 rev4 按 smoke8 全量撞帽统计（20 次，见开发日志）+ 用户裁决放量：
    # 撞帽=被迫无工具收尾交判决（审查依据不全）；本次冒烟目标=各阶段完整走完。
    SEEK: 24         # smoke8 撞 21/20；fetch_paper_fulltext 全文核验会增调用量
    NOVELTY: 45   # smoke10 检视：web_fetch 失败重试吃额度（4 截断）      # 4/4 campaign 撞 12/10（用户裁决；多角度+带年份查重吃调用）
    SCREEN: 50       # 4/4 撞 9/8（用户裁决；写→跑→看反例脚本一角度 3-4 次）
    DESIGN: 50
    VERIFY: 36       # worker 循环末轮用光 30/30
    GRADE: 5
    WRITE: 20     # smoke10 检视：2 截断且与漏项相关        # worker 撞 13/12（四节分章 write_file）
    REVIEW: 2
    REFINE: 24    # smoke10 检视       # 3 次撞 6-8/6（用户裁决；四路评审意见多章改写）
    EXP_SPEC: 26  # smoke10 检视：两幸存战役 4/4 全撞帽（smoke8 同型旧病）       # smoke8 实证：三问联合简报的实验矩阵大，4 轮返工每轮
                       # 都撞 14 帽截断（15-17 次）后带 blocker degraded 进 WRITE
    EXP_FEASIBILITY: 22  # smoke10 检视：同上  # 同上：每轮撞 12 帽（13 次）

storage:
  db_path: "data/haa.db"       # 主库（实战姿态）
  campaigns_dir: "data/campaigns"

logging:
  level: "INFO"
  format: "text"
  output: "stdout"
