[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haa"
version = "0.1.0"
description = "Hyacinth Automated Analyzer — code-driven state machine for automated research and paper writing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hyacinth" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "litellm>=1.35",
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "aiofiles>=23.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.7",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# `haa` CLI entry point → haa.cli.main:app (typer app)
haa = "haa.cli.main:app"

[tool.setuptools.packages.find]
# Only package our code dirs; skip data/prompts/frontend/runtime artifacts.
include = ["haa*", "api*"]
exclude = ["tests*", "data*", "frontend*", "prompts*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
